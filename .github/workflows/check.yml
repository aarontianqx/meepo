name: Check
# Temporarily manual-only to avoid spending GitHub Actions minutes; validation runs on the
# happy1 deployment host. Restore `on: [push, pull_request]` to re-enable.
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
